<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commute · eyes-off — SME Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="commute">
  <header class="mast">
    <div>
      <p class="kicker">Eyes-off · ranked by purpose</p>
      <h1>Commute</h1>
      <nav class="mast-nav" aria-label="Atlas">
        <a href="index.html">Tonight</a>
        <a href="commute.html" aria-current="page">Commute · eyes-off</a>
        <a href="library.html">Library · unassigned</a>
      </nav>
    </div>
  </header>

  <p class="rule">
    Four rails: learn a concept, hear people, ship something, stay current.
    Ranked inside each rail. Play streams the original enclosure. Titles open show notes. Ticks do not count as Do.
  </p>

  <section class="commute" id="commute"></section>
  <p class="focus-tools">
    <button type="button" id="undo" hidden>Undo last tick</button>
  </p>

  <main id="map" class="map"></main>
  <aside id="drawer" class="drawer" hidden></aside>

  <form class="find" id="find" autocomplete="off">
    <label for="q">What are you trying to learn?</label>
    <div class="find-row">
      <input id="q" type="search" name="topic" placeholder="langgraph, MCP, claude code, RLHF…" />
      <button type="submit">Ask the shelf</button>
    </div>
  </form>
  <section id="hits" class="hits" hidden></section>
  <section class="harvest" id="harvest"></section>

  <aside class="player player-deck" id="player" hidden>
    <div class="player-art" id="player-art" aria-hidden="true"></div>
    <div class="player-copy">
      <p class="kicker" id="player-show">Now playing</p>
      <p id="player-title"></p>
      <p class="player-station" id="player-station"></p>
    </div>
    <audio id="player-audio"></audio>
    <div class="player-controls">
      <div class="player-transport">
        <button type="button" data-skip="-15" aria-label="Back 15 seconds">−15</button>
        <button type="button" id="player-prev" aria-label="Previous episode">Prev</button>
        <button type="button" id="player-toggle" class="player-play" aria-label="Play or pause">Play</button>
        <button type="button" id="player-next" aria-label="Next episode">Next</button>
        <button type="button" data-skip="15" aria-label="Forward 15 seconds">+15</button>
      </div>
      <label class="player-seek-label">
        <span id="player-elapsed">0:00</span>
        <span class="visually-hidden">Seek</span>
        <input id="player-seek" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="player-remain">0:00</span>
      </label>
      <div class="speeds" role="group" aria-label="Playback speed">
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="1.25">1.25×</button>
        <button type="button" data-speed="1.5">1.5×</button>
        <button type="button" data-speed="2">2×</button>
      </div>
    </div>
  </aside>

  <script src="app.js" type="module"></script>
</body>
</html>
